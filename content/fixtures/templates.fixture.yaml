# 合成测试模板（fixture=true，生产环境自动排除）
templates:
  - schema_version: 1
    slug: fixture-fullbody-2d
    content_version: 1
    display_name: "[测试] 全身两天（fixture）"
    intended_population: "测试与演示环境"
    sessions_per_week: 2
    required_intake_fields: ["goal", "sessions_per_week", "minutes_per_session", "equipment"]
    eligibility: { requires_load_calibration: true }
    session_slots:
      - { slot_key: squat, movement_pattern: squat, exercise_count: 1 }
      - { slot_key: push, movement_pattern: push, exercise_count: 1 }
      - { slot_key: pull, movement_pattern: pull, exercise_count: 1 }
    allowed_exercise_ids: []
    allowed_set_ranges: { min: 2, max: 3 }
    allowed_rep_ranges: { min: 8, max: 12 }
    allowed_rest_ranges: { min: 60, max: 180 }
    target_rir_ranges: { min: 2, max: 4 }
    progression_policy: hold
    time_estimation_parameters: { seconds_per_set: 40, warmup_minutes: 5, exercise_transition_minutes: 2 }
    approved_short_session_variants: []
    evidence_refs: []
    review_status: draft
    fixture: true

  - schema_version: 1
    slug: fixture-fullbody-3d
