# Alembic Configuration

[alembic]
# Path to migration scripts (%(here)s = this file's directory, so the
# command works from the repo root or apps/api)
script_location = %(here)s/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
# timezone = Asia/Shanghai

# Prepend sys.path
prepend_sys_path = %(here)s/src

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database connection string (will be overridden by env.py from environment)
sqlalchemy.url = postgresql+asyncpg://muscle_training:dev_password@localhost:5432/muscle_training_dev

[post_write_hooks]
# Automatically format generated migrations with ruff
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
