<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI 驱动的个性化健身训练应用" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="健身教练" />
    <title>私人健身教练</title>
    <script>
      // Apply persisted/system theme before first paint (anti-flash).
      // Must stay inline & dependency-free; mirrors hooks/useTheme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode');
          var dark =
            mode === 'dark' ||
            ((mode === null || mode === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
