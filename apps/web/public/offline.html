<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - Muscle Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #111;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .features {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            margin-top: 24px;
            text-align: left;
        }

        .features h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .features ul {
            list-style: none;
        }

        .features li {
            padding: 8px 0;
            color: #6b7280;
            font-size: 14px;
        }

        .features li:before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
            margin-right: 8px;
        }

        .button {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .button:hover {
            background: #4338ca;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            font-size: 14px;
            color: #92400e;
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>您当前处于离线状态</h1>
        <p>无法连接到服务器，但您仍然可以使用离线功能记录训练数据。</p>

        <div class="features">
            <h2>离线可用功能</h2>
            <ul>
                <li>记录训练会话和组数据</li>
                <li>查看已缓存的训练计划</li>
                <li>浏览本地存储的动作库</li>
                <li>数据将在网络恢复后自动同步</li>
            </ul>
        </div>

        <a href="/" class="button">返回应用</a>

        <div class="status" id="status">
            正在检查网络连接...
        </div>
    </div>

    <script>
        // Check network status
        function updateStatus() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.textContent = '✓ 网络已恢复！正在重新连接...';
                status.style.background = '#d1fae5';
                status.style.color = '#065f46';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                status.textContent = '⚠ 当前离线 - 您记录的数据将在网络恢复后同步';
            }
        }

        // Listen for online event
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // Initial check
        updateStatus();

        // Periodic check
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
